# ── Dataset ───────────────────────────────────────────────────────────────────
dataset: nuscenes
name: nuscenes_mini       # used for output directory and run name
data_root: /media/lleba/ECP_Nuscenes_01/nuScenes_mini
version: v1.0-mini
camera: CAM_FRONT
split: train
mapping_name: 8class

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: /home/lleba/Thesis/Development/AutoLabeling/output/nuscenes_mini

# ── Model paths ───────────────────────────────────────────────────────────────
# null values are resolved automatically relative to dev_root
models:
  dev_root: /home/lleba/Thesis/Development
  sam3_ckpt: null            # null = auto-download from HuggingFace Hub
  sam3d_body_repo: null      # null = <dev_root>/Models/SAM3D/sam-3d-body
  sam3d_obj_cfg: null        # null = <dev_root>/Models/SAM3D/sam-3d-objects/checkpoints/hf/pipeline.yaml

# ── Detection thresholds ──────────────────────────────────────────────────────
thresholds:
  sam3_score: 0.5            # min SAM3 mask probability to keep
  min_mask_px: 100           # min mask area in pixels
  body_bbox: 0.8             # ViTDet confidence threshold for SAM3D Body
  sam3_iou_merge: 0.4        # IoU above which a ViTDet box duplicates a SAM3 box

# ── SAM3D Objects ──────────────────────────────────────────────────────────────
# Controls what depth information SAM3D Objects sees per frame (pointmap input).
#   baseline         — dense MoGe relative-depth pointmap, no LiDAR (original pipeline)
#   o1_lidar         — sparse metric LiDAR pointmap; NaN where no LiDAR hit
#   o2_moge_affine   — dense MoGe pointmap globally calibrated to metric via
#                      least-squares fit  Z_metric = a*Z_moge + b  on in-image LiDAR returns
#   o3_local_affine  — dense MoGe pointmap with a per-object affine fit; HDBSCAN isolates
#                      each object's surface points, then fits a separate (a,b) per object
#   o4_ground_filter — CompletionFormer + global PseudoLabeler ground filter before sparse anchors
#   o5_mask_hdbscan  — CompletionFormer + per-mask HDBSCAN anchor cleaning (no ground filter)
sam3d_objects:
  pointmap_mode: o1_lidar
  # O4/O5 settings — used when pointmap_mode is o4_ground_filter or o5_mask_hdbscan
  cformer_ckpt: /home/lleba/Thesis/Development/Models/CompletionFormer/checkpoints/KITTIDC/KITTIDC_L1L2.pt
  lidar_lines: 32      # nuScenes: 32-beam Velodyne
  # SS Correction: mid-pipeline voxel occupancy correction using CFormer depth map.
  # Requires pointmap_mode in (o4_ground_filter, o5_mask_hdbscan). Strict no-op when false.
  # Run naming appends _sscorr when true.
  ss_correction: false
  # Hull anchoring: post-CFormer per-mask depth clamp.
  # Inside each mask's convex hull, dense_depth = max(dense_depth, min_lidar_depth)
  # where min_lidar_depth = min cam-depth of the dominant HDBSCAN cluster.
  # Prevents occluder (pole/sign) LiDAR depth from bleeding into object interiors.
  # Only active when pointmap_mode is o4_ground_filter or o5_mask_hdbscan.
  hull_anchoring: true
  # O5 proximity selection: when two large clusters both have ≥ proximity_min_pts pts
  # and the second is ≥ proximity_ratio × largest, pick the CLOSER one in ego space.
  proximity_min_pts: 30
  proximity_ratio: 0.70
  # O4 ground filter: max height above predicted road surface to classify a LiDAR
  # point as a ground return (removed before CFormer sparse anchors).  Not used by
  # B2 — B2 queries PseudoLabeler directly for ground height, no threshold needed.
  # Model default is 0.40 m (semantic labeling); 0.10 m keeps bicycle frames / bumpers.
  pl_ground_inlier_thres: 0.10   # m
  # HDBSCAN params for in-mask surface point isolation (O3 + B1).
  # Tuned per class: smaller/sparser objects use tighter eps; large vehicles need
  # a wider eps to merge subclusters across the body.  nuScenes uses a 32-beam
  # LiDAR so min_cluster_size is kept lower than ECP defaults.
  hdbscan:
    pedestrian:
      min_cluster_size: 3
      min_samples: 1
      cluster_eps: 0.20
    bicycle:
      min_cluster_size: 3
      min_samples: 1
      cluster_eps: 0.20
    motorcycle:
      min_cluster_size: 3
      min_samples: 1
      cluster_eps: 0.30
    car:
      min_cluster_size: 3
      min_samples: 1
      cluster_eps: 0.50
    truck:
      min_cluster_size: 5
      min_samples: 1
      cluster_eps: 0.60
    construction vehicle:
      min_cluster_size: 5
      min_samples: 1
      cluster_eps: 0.60
    bus:
      min_cluster_size: 5
      min_samples: 1
      cluster_eps: 0.80
    trailer:
      min_cluster_size: 5
      min_samples: 1
      cluster_eps: 0.70

# ── LiDAR point cloud pre-filters ─────────────────────────────────────────────
# Applied to the full ego-frame cloud after loading/aggregation, before camera
# projection and any HDBSCAN in-mask clustering (B1 + O3).
#
# Ego-body filter: removes returns from the vehicle's own roof/windshield/mount.
#   These sit at z ≈ 1.5–2 m in ego frame and become a dense strip after sweep
#   aggregation; without filtering they can dominate HDBSCAN for nearby objects.
#   Only points inside the box AND within the Z band are removed:
#     |x| < ego_box_half_x  AND  |y| < ego_box_half_y
#     AND  ego_box_z_min < z < ego_box_z_max
#   (Z band preserves close ground-level returns and very tall objects above.)
#
# Max range filter: removes points beyond max_range_m BEV distance (sqrt(x²+y²)).
#   Set 2 m above the 50 m evaluation limit to cut distant background returns
#   that could form spurious HDBSCAN clusters inside far projected masks.
lidar_filters:
  use_ego_body_filter: true
  ego_box_half_x: 4.0    # half-length fore/aft [m]
  ego_box_half_y: 1.5    # half-width left/right [m]
  ego_box_z_min:  0.5    # lower Z cutoff — preserves close ground returns [m]
  ego_box_z_max:  2.5    # upper Z cutoff — preserves tall objects above [m]
  max_range_m:   52.0    # BEV range cutoff (eval limit 50 m + 2 m margin) [m]

# ── LiDAR aggregation ─────────────────────────────────────────────────────────
# When use_aggregation=true, n_before + anchor + n_after sweeps are combined
# after ego-motion compensation (all transformed to the anchor ego frame).
# Denser point clouds improve B1/B2 corrections and O1/O2/O3 LiDAR pointmaps.
# nuScenes uses a 32-beam LiDAR → more sweeps recommended to increase density.
lidar_aggregation:
  use_aggregation: true
  n_before: 3      # sweeps before anchor keyframe
  n_after: 3       # sweeps after anchor keyframe

# ── SAM3D Body ─────────────────────────────────────────────────────────────────
# Controls LiDAR-based post-inference correction for pedestrian meshes.
#   baseline           — no correction; use SAM3D Body depth prediction as-is
#   b1_lidar_correction — two-stage correction:
#               Stage 1: override tz with HDBSCAN-filtered median in-mask LiDAR depth,
#                        recompute tx/ty from mask centroid
#               Stage 2: anchor mesh feet to ground via PseudoLabeler MLP
#                        (fitted per frame on raw LiDAR; RANSAC fallback if fitting fails)
sam3d_body:
  correction_mode: b1_lidar_correction   # 'baseline' | 'b1_lidar_correction'
  # B1:
  #   Stage 1 — override tz with HDBSCAN-filtered median in-mask LiDAR depth,
  #             recompute tx/ty from mask centroid.
  #   Stage 2 — anchor mesh feet to local ground via PseudoLabeler MLP fitted
  #             per frame on the raw LiDAR sweep (RANSAC global fallback if fitting fails).

# ── Cross-class deduplication ─────────────────────────────────────────────────
# When the same physical object is detected under two different prompts, the
# lower-priority class is removed if mask IoU > iou_thresh.
# Equal-priority pairs are kept as-is.  Raise a class's value to make it "win"
# over others; lower it to make it more likely to be replaced.
cross_class_dedup:
  iou_thresh: 0.5
  priority:                   # strictly unique — every pair has a definite winner
    pedestrian:           0   # generic person
    car:                  1   # generic vehicle
    bicycle:              2   # bike frame only (rider handled by SAM3D Body + OBB merge)
    truck:                3   # specific vehicle; beaten by bus / constr. / trailer
    motorcycle:           4   # motorised rider > bicycle
    trailer:              5   # more specific
    bus:                  6   # large vehicle > truck
    construction vehicle: 7   # heavy equipment and most specific

# ── SAM3 prompts ──────────────────────────────────────────────────────────────
# pipeline: 'body' → SAM3D Body | 'objects' → SAM3D Objects
# Note: 'bicycle and cyclist' split into 'bicycle' (objects) + 'pedestrian' (body).
# Rider OBBs are merged with the bike OBB in post-processing (_merge_rider_obbs).
prompts:
  pedestrian:           body
  car:                  objects
  bicycle:              objects
  motorcycle:           objects
  bus:                  objects
  truck:                objects
  construction vehicle: objects
  trailer:              objects
